packages:
  - "apps/*"
  - "packages/*"

# 2 days in minutes
minimumReleaseAge: 2880
savePrefix: ""

tasks:
  build:
    dependsOn: ["^build"]
    outputs: ["build/**"]
  test:
    dependsOn: ["^build"]
    outputs: []

pipelines:
  default: [test, build]
  check: [test]

catalog:
  oxfmt: "0.74.0"
  oxlint: "1.89.0"
  oxlint-tsgolint: "7.0.2004"
  typescript: "7.0.2"
  vitest: "5.0.5"
  "@react-router/dev": "8.5.0"
  "@react-router/serve": "8.5.0"
  "@types/node": "24.19.2"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  isbot: "5.2.2"
  react: "19.3.1"
  react-dom: "19.3.1"
  react-router: "8.5.0"
  vite: "8.3.5"
