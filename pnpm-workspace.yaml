packages:
  - "apps/*"
  - "packages/*"

# 2 days in minutes
minimumReleaseAge: 2880
savePrefix: ""

tasks:
  build:
    dependsOn: ["^build"]
    outputs: ["dist/**"]
  test:
    dependsOn: ["^build"]
    outputs: []

pipelines:
  default: [test, build]
  check: [test]

catalog:
  oxfmt: "0.74.0"
  oxlint: "1.89.0"
  oxlint-tsgolint: "7.0.2004"
  typescript: "7.0.2"
  vitest: "5.0.5"
