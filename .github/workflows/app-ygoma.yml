name: app:ygoma

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    if: github.event.action != 'closed'
    uses: $/.github/workflows/target-docker.yml
    with:
      app: ygoma

  preview:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/target-cloudflare.yml
    with:
      app: ygoma
      environment: preview
      branch: ${{ github.head_ref }}
      workers-subdomain: ygoma-stg
      ephemeral-labels: dependencies
    # Caller-side values are empty; named here so the called jobs read ygoma-preview's.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASIC_AUTH: ${{ secrets.BASIC_AUTH }}

  staging:
    if: github.event_name == 'push'
    uses: $/.github/workflows/target-cloudflare.yml
    with:
      app: ygoma
      environment: staging
      workers-subdomain: ygoma-stg
    # Caller-side values are empty; named here so the called jobs read ygoma-staging's.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
