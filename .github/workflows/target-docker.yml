name: target-docker

on:
  workflow_call:
    inputs:
      app:
        description: Directory under apps/, built from apps/<app>/Dockerfile.
        required: true
        type: string

permissions:
  contents: read

env:
  # The PR head, not the merge commit GitHub builds: the one a reader can look up.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: target-docker-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      APP: ${{ inputs.app }}
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Data in RAM: the job throws the server away.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        id: build
        run: docker build -f "apps/$APP/Dockerfile" --build-arg "APP_REVISION=$HEAD_SHA" -t "$APP" .

      - name: Start container (SQLite)
        id: sqlite-start
        run: docker run -d --name "$APP-sqlite" -p 3000:3000 "$APP"

      - name: Probe container (SQLite)
        uses: $/.github/actions/probe
        with:
          url: http://localhost:3000
          sha: ${{ env.HEAD_SHA }}
          timeout-seconds: 30

      - name: Show container logs (SQLite)
        if: failure() && steps.sqlite-start.outcome == 'success'
        run: docker logs "$APP-sqlite"

      # Runs after a SQLite failure too, so each database reports on its own.
      - name: Start container (Postgres)
        id: postgres-start
        if: "!cancelled() && steps.build.outcome == 'success'"
        # The service listens on the runner, not on the container's localhost.
        run: >-
          docker run -d --name "$APP-postgres" -p 3001:3000
          --add-host host.docker.internal:host-gateway
          -e DEFAULT_DATABASE_URL=postgres://postgres@host.docker.internal:5433/postgres
          "$APP"

      - name: Probe container (Postgres)
        id: postgres-probe
        if: "!cancelled() && steps.postgres-start.outcome == 'success'"
        uses: $/.github/actions/probe
        with:
          url: http://localhost:3001
          sha: ${{ env.HEAD_SHA }}
          timeout-seconds: 30

      - name: Show container logs (Postgres)
        if: "!cancelled() && steps.postgres-probe.outcome == 'failure'"
        run: docker logs "$APP-postgres"
