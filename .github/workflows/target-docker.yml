name: target-docker

on:
  workflow_call:
    inputs:
      app:
        description: Directory under apps/, built from apps/<app>/Dockerfile.
        required: true
        type: string

permissions:
  contents: read

env:
  # The PR head, not the merge commit GitHub builds: the one a reader can look up.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: target-docker-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      APP: ${{ inputs.app }}
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Data in RAM: the job throws the server away.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        id: build
        run: docker build -f "apps/$APP/Dockerfile" --build-arg "APP_REVISION=$HEAD_SHA" -t "$APP" .

      - name: Probe image (SQLite)
        uses: $/.github/actions/probe-docker
        with:
          image: ${{ env.APP }}
          container: ${{ env.APP }}-sqlite
          port: 3000
          sha: ${{ env.HEAD_SHA }}
          run-args: -e DEFAULT_DATABASE_URL=sqlite:/nonexistent/ygoma.db

      # Runs after a SQLite failure too, so each database reports on its own.
      - name: Probe image (Postgres)
        if: "!cancelled() && steps.build.outcome == 'success'"
        uses: $/.github/actions/probe-docker
        with:
          image: ${{ env.APP }}
          container: ${{ env.APP }}-postgres
          port: 3001
          sha: ${{ env.HEAD_SHA }}
          # Job services listen on the runner, not on the container's localhost.
          run-args: >-
            --add-host host.docker.internal:host-gateway
            -e DEFAULT_DATABASE_URL=postgres://postgres@host.docker.internal:5432/postgres
