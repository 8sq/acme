name: ygoma-deploy-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/target-cloudflare.yml
    with:
      app: ygoma
      environment: preview
      branch: ${{ github.head_ref }}
      workers-subdomain: ygoma-stg
      ephemeral-labels: dependencies
    # The called job reads ygoma-preview's secrets only when the caller inherits.
    secrets: inherit
