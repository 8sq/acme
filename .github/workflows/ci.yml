name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      # Same as the Dockerfile: pnpm switches itself to `packageManager`.
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile

      # --full: on a push to main nothing differs from origin/main.
      - run: pnpm check --full
      - run: pnpm --filter @acme/ygoma build
      - run: pnpm --filter @acme/ygoma build:workerd

  docker:
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker build -f apps/ygoma/Dockerfile -t ygoma .
      - run: docker run -d --name ygoma -p 3000:3000 ygoma

      - uses: ./.github/actions/probe
        with:
          url: http://localhost:3000/
          timeout-seconds: 30

      - if: failure()
        run: docker logs ygoma
