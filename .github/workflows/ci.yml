name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      # Same as the Dockerfile: pnpm switches itself to `packageManager`.
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile

      # --full: on a push to main nothing differs from origin/main.
      - run: pnpm check --full
      - run: pnpm --filter @acme/yugioh-ma build
      - run: pnpm --filter @acme/yugioh-ma build:workerd

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker build -f apps/yugioh-ma/Dockerfile -t yugioh-ma .
      - run: docker run -d --name yugioh-ma -p 3000:3000 yugioh-ma

      # React's SSR puts `<!-- -->` between "Hello from " and the runtime name.
      - run: |
          for _ in $(seq 30); do
            if curl -fs --max-time 1 http://localhost:3000/ | grep -qE 'Hello from (<!-- -->)?node'; then
              exit 0
            fi
            sleep 1
          done
          docker logs yugioh-ma
          exit 1
