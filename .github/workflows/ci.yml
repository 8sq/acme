name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Setup
        uses: $/.github/actions/setup

      - name: Check
        run: pnpm check
