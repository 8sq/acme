name: target-cloudflare

on:
  workflow_call:
    inputs:
      app:
        description: Directory under apps/, package @acme/<app>.
        required: true
        type: string
      environment:
        description: preview, staging or production; the GitHub environment is <app>-<environment>.
        required: true
        type: string
      branch:
        description: Head branch, required for preview; the Worker is <app>-<branch slug>.
        required: false
        type: string
        default: ""
      workers-subdomain:
        description: Account workers.dev subdomain, used for the environment URL.
        required: true
        type: string
    # Callers pass `secrets: inherit`; the job then reads them from its environment.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      BASIC_AUTH:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.app }}-${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: target-cloudflare-${{ inputs.app }}-${{ inputs.environment }}-${{ inputs.branch }}
      cancel-in-progress: true
    steps:
      # The worker serves ungated without BASIC_AUTH, so only production may deploy without it.
      - name: Checks
        id: checks
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          BRANCH: ${{ inputs.branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
        run: |
          case "$DEPLOY_ENV" in
            preview | staging | production) ;;
            *) echo "::error::Unknown environment '$DEPLOY_ENV'." && exit 1 ;;
          esac

          if [ "$DEPLOY_ENV" = "preview" ] && [ -z "$BRANCH" ]; then
            echo "::error::A preview deploy needs a branch."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # Forks have no secrets; skipping staging or production would fake a deploy.
            if [ "$DEPLOY_ENV" == "preview" ]; then
              echo "::notice::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID, skipping the deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID for $DEPLOY_ENV."
              exit 1
            fi
          elif [ "$DEPLOY_ENV" != "production" ] && [[ "$BASIC_AUTH" != ?*:* ]]; then
            echo "::error::BASIC_AUTH is missing or not user:password."
            exit 1
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # A branch slugged to "staging" must not take over <app>-staging.
      - name: Resolve names
        id: names
        env:
          APP: ${{ inputs.app }}
          DEPLOY_ENV: ${{ inputs.environment }}
          BRANCH: ${{ inputs.branch }}
        run: |
          # 63 is the DNS label limit of <scoped-slug>.<subdomain>.workers.dev.
          slugify() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-63 | sed -E 's/^-+//; s/-+$//'; }
          case "$DEPLOY_ENV" in
            preview)
              slug=$(slugify "$BRANCH")
              case "$slug" in staging | "") slug=$(slugify "branch-$slug") ;; esac
              ;;
            staging) slug=staging ;;
            production) slug="" ;;
          esac

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "scoped-slug=$(slugify "$APP-$slug")" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APP: ${{ inputs.app }}
        run: pnpm --filter "@acme/$APP..." run build:workerd

      # A secret, not --var: vars show in the dashboard and deployment logs.
      - name: Deploy
        id: deploy
        if: steps.checks.outputs.deploy == 'true'
        working-directory: apps/${{ inputs.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
          DEPLOY_ENV: ${{ inputs.environment }}
          WORKER: ${{ steps.names.outputs.scoped-slug }}
          WORKERS_SUBDOMAIN: ${{ inputs.workers-subdomain }}
        run: |
          secrets='{}'
          add_secret() {
            secrets=$(jq --arg name "$1" --arg value "$2" '.[$name] = $value' <<< "$secrets")
          }

          if [ "$DEPLOY_ENV" != "production" ]; then
            add_secret BASIC_AUTH "$BASIC_AUTH"
          fi

          pnpm exec wrangler deploy --name "$WORKER" --secrets-file <(printf '%s' "$secrets")
          echo "url=https://$WORKER.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Probe
        if: steps.checks.outputs.deploy == 'true'
        uses: ./.github/actions/probe
        with:
          url: ${{ steps.deploy.outputs.url }}/
          credentials: ${{ inputs.environment != 'production' && secrets.BASIC_AUTH || '' }}
