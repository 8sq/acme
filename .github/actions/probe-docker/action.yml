name: Probe Docker
description: Run an image, probe it, then require a clean exit on SIGTERM.

inputs:
  image:
    description: Image to run.
    required: true
  container:
    description: Container name, unique within the job.
    required: true
  port:
    description: Host port mapped to target-port.
    required: true
  target-port:
    description: Port the container listens on.
    required: false
    default: "3000"
  sha:
    description: Commit the image was stamped with, passed to the probe.
    required: true
  run-args:
    description: Extra arguments for docker run, split on whitespace.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Start container
      id: start
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTAINER: ${{ inputs.container }}
        PORT: ${{ inputs.port }}
        TARGET_PORT: ${{ inputs.target-port }}
        RUN_ARGS: ${{ inputs.run-args }}
      # read stops at the first newline, so newlines become spaces first.
      run: |
        read -ra docker_args <<< "${RUN_ARGS//$'\n'/ }"
        docker run -d --name "$CONTAINER" -p "$PORT:$TARGET_PORT" \
          "${docker_args[@]}" "$IMAGE"

    - name: Probe container
      uses: $/.github/actions/probe
      with:
        url: http://localhost:${{ inputs.port }}
        sha: ${{ inputs.sha }}
        timeout-seconds: 30

    - name: Stop container
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
      run: |
        grace=10
        started=$(date +%s%N)
        docker stop -t "$grace" "$CONTAINER" > /dev/null
        took_ms=$((($(date +%s%N) - started) / 1000000))
        code=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER")
        if [ "$code" != 0 ]; then
          # 137 is SIGKILL: docker stop gave up after the grace period.
          echo "::error::$CONTAINER exited $code after ${took_ms}ms instead of stopping on SIGTERM."
          exit 1
        fi
        # Exit 0 this close to SIGKILL is luck: a slower runner gets killed.
        if [ "$took_ms" -ge $((grace * 900)) ]; then
          echo "::error::$CONTAINER took ${took_ms}ms of its ${grace}s grace period to stop."
          exit 1
        fi
        echo "::notice::$CONTAINER stopped cleanly in ${took_ms}ms."

    - name: Show container logs
      if: failure() && steps.start.outcome == 'success'
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
      run: docker logs "$CONTAINER"
